# ============================================================
# TVBox 源自动同步 —— GitHub Actions 云端部署
#
# 作用：GitHub 云端每 6 小时自动跑一次采集，
#       结果自动提交回仓库，并生成 Pages 站点。
#       电视端填 Pages 地址即可，手机无需开机。
#
# 部署步骤：
#   1. 新建一个 GitHub 仓库（名字随意，例如 tvbox-sync）
#   2. 把本目录文件全部上传（sources.json / tvbox_sync.py / gen_status_page.py）
#   3. 新建 .github/workflows/update.yml（本目录已提供）
#   4. 仓库 Settings → Pages → Source 选 GitHub Actions
#   5. Actions 标签页手动 Run workflow 触发首次运行
#   6. 几分钟后访问 https://<你的用户名>.github.io/tvbox-sync/tvbox.json
#
# 注意：仓库必须设为 Public（Public 免费，Private 需付费）
# ============================================================
name: Update TVBox config

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC 时间
    # 北京时间 07:00 / 13:00 / 19:00 / 01:00  =>  UTC 23:00 / 05:00 / 11:00 / 17:00
    - cron: '17,23 5,11,17,23 * * *'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write       # 允许自动提交

concurrency:
  group: tvbox-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集 / 验活 / 合并
        run: python3 tvbox_sync.py update

      - name: 生成状态面板
        run: python3 gen_status_page.py

      - name: 提交更新结果
        run: |
          git config user.name  "tvbox-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: auto update $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi

      - name: 发布 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4