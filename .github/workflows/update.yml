# ============================================================
# TVBox 源自动同步 —— GitHub Actions 云端部署
#
# 作用：GitHub 云端每 6 小时自动跑一次采集，
#       结果自动提交回仓库，并通过 Actions 发布 Pages。
#       电视端填 Pages 地址即可，手机无需开机。
#
# 部署步骤：
#   1. 新建一个 Public GitHub 仓库，把本目录文件按结构上传
#   2. 仓库 Settings → Pages → Source 选 GitHub Actions
#   3. Actions 标签页手动 Run workflow 触发首次运行
#   4. 访问 https://<用户名>.github.io/<仓库>/tvbox.json 验证
#
# 注意：仓库必须设为 Public（Public 免费，Private 需付费）
# ============================================================
name: Update TVBox config

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC 时间
    # 每 6 小时一次（错开整点，避免和大量定时任务撞车）
    - cron: '17,23 5,11,17,23 * * *'
  workflow_dispatch:   # 支持手动触发
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write       # 允许自动提交采集结果
  pages: write          # 允许发布 Pages
  id-token: write       # Pages 部署令牌

concurrency:
  group: tvbox-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集 / 验活 / 合并
        env:
          TVBOX_GITHUB_OWNER: Captain-2019
          TVBOX_GITHUB_REPO: tvbox-sync
        run: python3 tvbox_sync.py update

      - name: 生成状态面板
        run: python3 gen_status_page.py

      - name: 提交更新结果
        run: |
          git config user.name  "tvbox-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: auto update $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi

      # 采集产物作为 artifact 传给部署 job
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4